<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Project - Interactive Food Delivery Menu App</title>
<style>
  :root {
    --ink: #1e2530;
    --muted: #6b7685;
    --line: #e4e7eb;
    --accent: #b8481f;
    --accent-soft: #fbe9e2;
    --surface: #ffffff;
    --bg: #f6f4f0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 24px;
  }
  .app { max-width: 760px; margin: 0 auto; }
  header h1 { font-size: 1.5rem; margin-bottom: 2px; }
  header p { color: var(--muted); margin-top: 0; font-size: 0.9rem; }

  nav.tabs { display: flex; gap: 8px; margin: 20px 0; border-bottom: 1px solid var(--line); }
  nav.tabs button {
    background: none; border: none; padding: 10px 16px; font-size: 0.95rem; font-weight: 600;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  nav.tabs .cart-count {
    display: inline-block; margin-left: 6px; background: var(--accent); color: white;
    border-radius: 999px; font-size: 0.7rem; padding: 1px 7px;
  }

  section.view { display: none; }
  section.view.active { display: block; }

  /* Restaurant selector */
  #restaurantSelectorWrap { margin-bottom: 16px; font-size: 0.9rem; }
  #restaurantSelector { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); }
  #restaurantStatus { color: var(--muted); font-size: 0.85rem; }
  #restaurantError { color: #b91c1c; font-size: 0.85rem; font-weight: 600; }

  /* Menu grid */
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .dish-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
  }
  .dish-card h3 { margin: 0 0 4px; font-size: 1rem; }
  .dish-card .meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 8px; }
  .veg-tag { display: inline-block; font-size: 0.7rem; padding: 1px 8px; border-radius: 999px; margin-right: 4px; }
  .veg-tag.veg { background: #dcfce7; color: #166534; }
  .veg-tag.nonveg { background: #fee2e2; color: #991b1b; }
  .dish-card .price { font-weight: 700; margin-bottom: 10px; }
  .dish-card button {
    width: 100%; padding: 8px; background: var(--accent); color: white; border: none;
    border-radius: 6px; cursor: pointer; font-weight: 600;
  }
  .dish-card button:hover { opacity: 0.9; }

  /* Cart view */
  #cartItems { list-style: none; padding: 0; }
  #cartItems li {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  #cartItems .qty-controls button {
    background: var(--accent-soft); color: var(--accent); border: none; width: 26px; height: 26px;
    border-radius: 6px; cursor: pointer; font-weight: 700;
  }
  #cartTotal { text-align: right; font-weight: 700; margin-top: 12px; }
  .empty-note { color: var(--muted); font-size: 0.9rem; }

  /* Clear cart view */
  #clearCartBtn {
    padding: 10px 18px; background: #b91c1c; color: white; border: none; border-radius: 6px;
    cursor: pointer; font-weight: 600;
  }
  #clearCartBtn:hover { opacity: 0.9; }
  #clearConfirm { margin-top: 10px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Food Delivery Menu</h1>
    <p>Browse dishes, manage your cart, and check out — all state persists across a refresh.</p>
  </header>

  <div id="restaurantSelectorWrap">
    <label for="restaurantSelector"><strong>Restaurant:</strong></label>
    <select id="restaurantSelector"></select>
    <span id="restaurantStatus">Loading restaurants...</span>
    <div id="restaurantError"></div>
  </div>

  <nav class="tabs">
    <button data-view="browse" class="active">Browse Menu</button>
    <button data-view="cart">View Cart <span class="cart-count" id="cartCount">0</span></button>
    <button data-view="clear">Clear Cart</button>
  </nav>

  <section id="browse" class="view active">
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <section id="cart" class="view">
    <ul id="cartItems"></ul>
    <p id="cartEmptyNote" class="empty-note">Your cart is empty. Add dishes from Browse Menu.</p>
    <div id="cartTotal"></div>
  </section>

  <section id="clear" class="view">
    <p>This removes every item currently in your cart. This cannot be undone.</p>
    <button id="clearCartBtn">Clear Cart</button>
    <p id="clearConfirm"></p>
  </section>
</div>

<script>
  // ---------- Data ----------
  const dishes = [
    { id: 1, name: "Paneer Tikka",     price: 180, category: "Food",     isVegetarian: true },
    { id: 2, name: "Chicken Biryani",  price: 260, category: "Food",     isVegetarian: false },
    { id: 3, name: "Veg Fried Rice",   price: 150, category: "Food",     isVegetarian: true },
    { id: 4, name: "Butter Chicken",   price: 280, category: "Food",     isVegetarian: false },
    { id: 5, name: "Mango Lassi",      price: 90,  category: "Beverage", isVegetarian: true },
    { id: 6, name: "Cold Coffee",      price: 110, category: "Beverage", isVegetarian: true },
    { id: 7, name: "Veg Spring Rolls", price: 140, category: "Food",     isVegetarian: true }
  ];

  const CART_KEY = "foodDeliveryCart";
  let cart = loadCart(); // { [dishId]: quantity }

  // ---------- Tab navigation ----------
  const tabButtons = document.querySelectorAll("nav.tabs button");
  const views = document.querySelectorAll("section.view");

  tabButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      tabButtons.forEach(b => b.classList.remove("active"));
      views.forEach(v => v.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.view).classList.add("active");
      if (btn.dataset.view === "cart") renderCart();
    });
  });

  // ---------- Menu rendering ----------
  function renderMenu() {
    const grid = document.getElementById("menuGrid");
    grid.innerHTML = "";
    dishes.forEach(dish => {
      const card = document.createElement("div");
      card.className = "dish-card";
      card.innerHTML = `
        <span class="veg-tag ${dish.isVegetarian ? "veg" : "nonveg"}">${dish.isVegetarian ? "Veg" : "Non-Veg"}</span>
        <h3>${dish.name}</h3>
        <div class="meta">${dish.category}</div>
        <div class="price">Rs ${dish.price}</div>
        <button data-id="${dish.id}">Add to Cart</button>
      `;
      grid.appendChild(card);
    });

    grid.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = Number(btn.dataset.id);
        cart[id] = (cart[id] || 0) + 1;
        saveCart();
        updateCartCount();
      });
    });
  }

  // ---------- Cart rendering ----------
  function renderCart() {
    const list = document.getElementById("cartItems");
    const emptyNote = document.getElementById("cartEmptyNote");
    const totalEl = document.getElementById("cartTotal");
    list.innerHTML = "";

    const entries = Object.entries(cart).filter(([, qty]) => qty > 0);

    if (entries.length === 0) {
      emptyNote.style.display = "block";
      totalEl.textContent = "";
      return;
    }
    emptyNote.style.display = "none";

    let total = 0;
    entries.forEach(([id, qty]) => {
      const dish = dishes.find(d => d.id === Number(id));
      if (!dish) return;
      total += dish.price * qty;

      const li = document.createElement("li");
      li.innerHTML = `
        <span>${dish.name} (Rs ${dish.price} each)</span>
        <span class="qty-controls">
          <button data-id="${id}" data-action="dec">-</button>
          <strong style="margin:0 8px;">${qty}</strong>
          <button data-id="${id}" data-action="inc">+</button>
        </span>
      `;
      list.appendChild(li);
    });

    totalEl.textContent = `Total: Rs ${total}`;

    list.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        if (btn.dataset.action === "inc") {
          cart[id] = (cart[id] || 0) + 1;
        } else {
          cart[id] = Math.max(0, (cart[id] || 0) - 1);
        }
        saveCart();
        updateCartCount();
        renderCart();
      });
    });
  }

  // ---------- Cart persistence ----------
  function loadCart() {
    try {
      const saved = localStorage.getItem(CART_KEY);
      return saved ? JSON.parse(saved) : {};
    } catch {
      return {};
    }
  }

  function saveCart() {
    localStorage.setItem(CART_KEY, JSON.stringify(cart));
  }

  function updateCartCount() {
    const count = Object.values(cart).reduce((sum, qty) => sum + qty, 0);
    document.getElementById("cartCount").textContent = count;
  }

  // ---------- Clear cart ----------
  document.getElementById("clearCartBtn").addEventListener("click", () => {
    cart = {};
    saveCart();
    updateCartCount();
    renderCart();
    document.getElementById("clearConfirm").textContent = "Cart cleared.";
  });

  // ---------- Restaurant list via Fetch API ----------
  async function loadRestaurantSelector() {
    const selector = document.getElementById("restaurantSelector");
    const status = document.getElementById("restaurantStatus");
    const errorBox = document.getElementById("restaurantError");

    try {
      const response = await fetch("https://jsonplaceholder.typicode.com/users");
      if (!response.ok) throw new Error(`Status ${response.status}`);
      const users = await response.json();

      users.forEach(user => {
        const option = document.createElement("option");
        option.value = user.id;
        option.textContent = user.name;
        selector.appendChild(option);
      });
      status.textContent = "";
    } catch (err) {
      status.textContent = "";
      errorBox.textContent = "Could not load restaurant list. Please try again later.";
      console.error(err);
    }
  }

  // ---------- Init ----------
  renderMenu();
  updateCartCount();
  loadRestaurantSelector();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Corrected - Favourite Food Items</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  li { padding: 4px 0; }
  li.favourite { font-weight: bold; background: #ffe9b3; }
  #error { color: red; font-weight: bold; }
  button { margin-left: 8px; cursor: pointer; }
</style>
</head>
<body>
  <h1>Food Items</h1>
  <p id="loading">Loading...</p>
  <p id="error"></p>
  <ul id="itemList"></ul>

  <script>
    const FAV_KEY = "favouriteItems"; // now stores an ARRAY of favourite post ids

    function getFavourites() {
      try {
        const saved = localStorage.getItem(FAV_KEY);
        return saved ? JSON.parse(saved) : [];
      } catch {
        return [];
      }
    }

    function toggleFavourite(id) {
      let favourites = getFavourites();
      if (favourites.includes(id)) {
        favourites = favourites.filter(favId => favId !== id);
      } else {
        favourites.push(id);
      }
      localStorage.setItem(FAV_KEY, JSON.stringify(favourites));
      return favourites;
    }

    async function loadItems() {
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts");
        if (!response.ok) throw new Error(`Status ${response.status}`);
        const posts = await response.json();
        document.getElementById("loading").style.display = "none";
        renderItems(posts.slice(0, 10));
      } catch (err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").textContent = "Failed to load items. Please try again later.";
        console.error(err);
      }
    }

    function renderItems(posts) {
      const list = document.getElementById("itemList");
      const favourites = getFavourites();

      // FIX: forEach gives each callback its own scoped `post`, so every
      // button correctly refers to the item it was created for — no shared
      // mutable loop variable, so the closure bug from the original is gone.
      posts.forEach(post => {
        const li = document.createElement("li");
        li.textContent = post.title + " ";

        const btn = document.createElement("button");
        btn.textContent = favourites.includes(post.id) ? "Remove Favourite" : "Add to Favourites";
        if (favourites.includes(post.id)) li.classList.add("favourite");

        btn.addEventListener("click", () => {
          const updated = toggleFavourite(post.id);
          const isFav = updated.includes(post.id);
          li.classList.toggle("favourite", isFav);
          btn.textContent = isFav ? "Remove Favourite" : "Add to Favourites";
        });

        li.appendChild(btn);
        list.appendChild(li);
      });
    }

    loadItems();
  </script>
</body>
</html>

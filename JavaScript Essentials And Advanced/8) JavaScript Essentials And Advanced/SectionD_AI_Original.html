<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Original - Favourite Food Items (BUGGY)</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  li.favourite { font-weight: bold; background: #ffe9b3; }
  #error { color: red; font-weight: bold; }
</style>
</head>
<body>
  <h1>Food Items</h1>
  <p id="loading">Loading...</p>
  <p id="error"></p>
  <ul id="itemList"></ul>

  <script>
    const FAV_KEY = "favouriteItem";

    async function loadItems() {
      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts");
        const posts = await response.json();
        document.getElementById("loading").style.display = "none";
        renderItems(posts.slice(0, 10));
      } catch (err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").textContent = "Failed to load items.";
      }
    }

    function renderItems(posts) {
      const list = document.getElementById("itemList");
      const savedFavourite = localStorage.getItem(FAV_KEY);

      // BUG: using `var i` in the loop means every button's click handler
      // closes over the SAME `i`, which equals posts.length once the loop finishes.
      // Clicking any button ends up favouriting the last post, not the clicked one.
      for (var i = 0; i < posts.length; i++) {
        const li = document.createElement("li");
        li.textContent = posts[i].title + " ";

        const btn = document.createElement("button");
        btn.textContent = "Add to Favourites";
        btn.onclick = function () {
          localStorage.setItem(FAV_KEY, posts[i].title); // <-- always uses final value of i
          document.querySelectorAll("#itemList li").forEach(el => el.classList.remove("favourite"));
          li.classList.add("favourite");
        };

        li.appendChild(btn);
        list.appendChild(li);

        if (posts[i].title === savedFavourite) {
          li.classList.add("favourite");
        }
      }
    }

    loadItems();
  </script>
</body>
</html>
